<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure 14 Label Dragger</title>
  <style>
    :root { color-scheme: light; --ink:#111; --muted:#555; --border:#c9c9c9; --panel:#f4f5f7; --accent:#1f5f9f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; display:grid; grid-template-columns:320px 1fr; height:100vh; overflow:hidden; }
    aside { border-right:1px solid var(--border); background:var(--panel); padding:14px; overflow:auto; }
    main { overflow:auto; background:linear-gradient(45deg,#f0f0f0 25%,transparent 25%),linear-gradient(-45deg,#f0f0f0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f0f0f0 75%),linear-gradient(-45deg,transparent 75%,#f0f0f0 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    h1 { font-size:18px; margin:0 0 12px; }
    p { font-size:13px; line-height:1.35; margin:8px 0; color:var(--muted); }
    button, label.file-button { display:inline-flex; align-items:center; justify-content:center; min-height:32px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--ink); font-weight:700; cursor:pointer; margin:3px 2px; font-size:13px; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .control-group { border-top:1px solid var(--border); padding-top:10px; margin-top:10px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0; font-size:13px; }
    input[type="range"] { width:170px; }
    input[type="number"] { width:74px; padding:4px 6px; border:1px solid var(--border); border-radius:4px; }
    textarea { width:100%; min-height:145px; resize:vertical; border:1px solid var(--border); border-radius:6px; font-family:Consolas, Monaco, monospace; font-size:11px; padding:8px; background:#fff; }
    #labelList { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:8px; }
    #labelList button { margin:0; min-height:28px; padding:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:12px; }
    #labelList button.selected { outline:2px solid var(--accent); outline-offset:1px; }
    #stage { width:max-content; height:max-content; padding:28px; }
    canvas { display:block; background:#fff; box-shadow:0 2px 18px rgba(0,0,0,.2); cursor:grab; }
    canvas.dragging { cursor:grabbing; }
    code { font-family:Consolas, Monaco, monospace; font-size:12px; background:#fff; padding:1px 4px; border:1px solid var(--border); border-radius:4px; }
    .small { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <aside>
    <h1>Figure 14 Label Dragger</h1>
    <p>Drag labels directly on the figure. Dashed leader lines stay pinned to their original anchors.</p>
    <p>Arrow keys nudge the selected label. Hold <code>Shift</code> for larger nudges.</p>
    <div class="control-group">
      <button id="zoomOut">-</button><button id="zoomIn">+</button><button id="fitWidth">Fit Width</button>
      <div class="row"><span>Zoom</span><input id="zoomRange" type="range" min="0.25" max="2.5" step="0.01" value="1" /></div>
      <div class="row"><span>Font size</span><input id="fontSize" type="number" min="24" max="140" value="100" /></div>
      <div class="row"><span>Line width</span><input id="lineWidth" type="number" min="1" max="14" value="10" /></div>
    </div>
    <div class="control-group">
      <button id="resetAnchors">Reset Labels To Anchors</button>
      <button id="resetLast">Reset To Starting Layout</button>
      <button id="clearSelection">Clear Selection</button>
      <div id="labelList"></div>
    </div>
    <div class="control-group">
      <button id="downloadPng" class="primary">Download Labeled PNG</button>
      <button id="downloadJson">Download Layout JSON</button>
      <label class="file-button" for="jsonFile">Load Layout JSON</label>
      <input id="jsonFile" type="file" accept="application/json,.json" hidden />
      <p class="small">The live canvas is downsampled for stability. PNG export is full resolution.</p>
    </div>
    <div class="control-group">
      <button id="copyJson">Copy Layout JSON</button>
      <button id="applyTextJson">Apply JSON Below</button>
      <textarea id="jsonText" spellcheck="false"></textarea>
    </div>
  </aside>
  <main id="viewport"><div id="stage"><canvas id="canvas"></canvas></div></main>
  <script src="Figure_14_label_anchors.js?v=20260527_all_panels"></script>
  <script>
    const ANCHOR_DATA = window.FIGURE14_LABEL_DATA || {};
    const IMAGE_SRC = ANCHOR_DATA.image || "Figure_14_label_dragger_base.png";
    const IMAGE_CACHE_BUST = "v=20260527_all_panels";
    const MAX_LIVE_PIXELS = 18000000;
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const viewport = document.getElementById("viewport");
    const zoomRange = document.getElementById("zoomRange");
    const fontSizeInput = document.getElementById("fontSize");
    const lineWidthInput = document.getElementById("lineWidth");
    const jsonText = document.getElementById("jsonText");
    const labelList = document.getElementById("labelList");
    const image = new Image();
    let renderScale = 1;
    let selected = null;
    let dragging = false;
    let dragOffset = { x: 0, y: 0 };

    if (ANCHOR_DATA.font_size) fontSizeInput.value = ANCHOR_DATA.font_size;
    if (ANCHOR_DATA.line_width) lineWidthInput.value = ANCHOR_DATA.line_width;

    const labels = (ANCHOR_DATA.labels || []).map(item => ({
      id: item.id, text: item.text,
      anchor: { x: item.anchor[0], y: item.anchor[1] },
      x: (item.position || item.anchor)[0], y: (item.position || item.anchor)[1],
      w: 0, h: 0,
    }));
    const initialLayout = { labels: labels.map(label => ({ id: label.id, position: [label.x, label.y] })) };

    function currentFont() { return `700 ${Number(fontSizeInput.value)}px Arial, Helvetica, sans-serif`; }
    function measureLabels(measureCtx) {
      measureCtx.save(); measureCtx.font = currentFont();
      for (const label of labels) { const m = measureCtx.measureText(label.text); label.w = m.width; label.h = Number(fontSizeInput.value); }
      measureCtx.restore();
    }
    function textBox(label) { return { left: label.x-label.w/2-10, top: label.y-label.h/2-8, right: label.x+label.w/2+10, bottom: label.y+label.h/2+8 }; }
    function closestPointOnBox(point, box) { return { x: Math.max(box.left, Math.min(point.x, box.right)), y: Math.max(box.top, Math.min(point.y, box.bottom)) }; }
    function drawDashedLine(drawCtx, from, to) {
      drawCtx.save(); drawCtx.setLineDash([14, 9]); drawCtx.lineWidth = Number(lineWidthInput.value); drawCtx.strokeStyle = "rgba(0,0,0,.72)";
      drawCtx.beginPath(); drawCtx.moveTo(from.x, from.y); drawCtx.lineTo(to.x, to.y); drawCtx.stroke(); drawCtx.restore();
    }
    function drawLabel(drawCtx, label, showSelection) {
      const box = textBox(label); const attach = closestPointOnBox(label.anchor, box); drawDashedLine(drawCtx, label.anchor, attach);
      drawCtx.save(); drawCtx.font = currentFont(); drawCtx.textAlign = "center"; drawCtx.textBaseline = "middle"; drawCtx.lineJoin = "round";
      drawCtx.strokeStyle = "white"; drawCtx.lineWidth = 6; drawCtx.strokeText(label.text, label.x, label.y);
      drawCtx.fillStyle = "black"; drawCtx.fillText(label.text, label.x, label.y);
      if (showSelection && selected === label) { drawCtx.setLineDash([8,6]); drawCtx.lineWidth = 2; drawCtx.strokeStyle = "#1f5f9f"; drawCtx.strokeRect(box.left, box.top, box.right-box.left, box.bottom-box.top); }
      drawCtx.restore();
    }
    function renderTo(drawCtx, scale, showSelection) {
      drawCtx.save(); drawCtx.setTransform(1,0,0,1,0,0); drawCtx.clearRect(0,0,drawCtx.canvas.width,drawCtx.canvas.height); drawCtx.restore();
      drawCtx.save(); drawCtx.setTransform(scale,0,0,scale,0,0); drawCtx.drawImage(image,0,0); measureLabels(drawCtx); for (const label of labels) drawLabel(drawCtx,label,showSelection); drawCtx.restore();
    }
    function renderCanvas() { if (!image.complete) return; renderTo(ctx, renderScale, true); updateJsonText(); updateLabelButtons(); }
    function setZoom(value) { zoomRange.value = String(value); canvas.style.width = `${Math.round(canvas.width * value)}px`; canvas.style.height = `${Math.round(canvas.height * value)}px`; }
    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const displayX = (event.clientX - rect.left) * canvas.width / rect.width;
      const displayY = (event.clientY - rect.top) * canvas.height / rect.height;
      return { x: displayX / renderScale, y: displayY / renderScale };
    }
    function hitTest(point) { for (let i=labels.length-1;i>=0;i--) { const b=textBox(labels[i]); if (point.x>=b.left&&point.x<=b.right&&point.y>=b.top&&point.y<=b.bottom) return labels[i]; } return null; }
    function updateJsonText() { jsonText.value = JSON.stringify({ image: IMAGE_SRC, font_size:Number(fontSizeInput.value), line_width:Number(lineWidthInput.value), labels: labels.map(l => ({ id:l.id, text:l.text, anchor:[Math.round(l.anchor.x),Math.round(l.anchor.y)], position:[Math.round(l.x),Math.round(l.y)] })) }, null, 2); }
    function applyLayoutObject(data) {
      const byId = new Map(labels.map(l => [l.id,l]));
      for (const item of (data.labels || [])) { const l=byId.get(item.id); if (l && Array.isArray(item.position)) { l.x=Number(item.position[0]); l.y=Number(item.position[1]); } }
      if (data.font_size) fontSizeInput.value = data.font_size; if (data.line_width) lineWidthInput.value = data.line_width; renderCanvas();
    }
    function download(filename, href) { const a=document.createElement("a"); a.href=href; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); }
    function updateLabelButtons() { for (const b of labelList.querySelectorAll("button")) b.classList.toggle("selected", selected && b.dataset.id === selected.id); }
    function buildLabelList() { labelList.innerHTML=""; for (const l of labels) { const b=document.createElement("button"); b.textContent=l.text; b.dataset.id=l.id; b.title=l.id; b.addEventListener("click",()=>{selected=l; renderCanvas();}); labelList.appendChild(b); } }

    canvas.addEventListener("pointerdown", e => { const p=canvasPoint(e); const hit=hitTest(p); selected=hit; if (hit) { dragging=true; canvas.classList.add("dragging"); dragOffset={x:p.x-hit.x,y:p.y-hit.y}; canvas.setPointerCapture(e.pointerId); } renderCanvas(); });
    canvas.addEventListener("pointermove", e => { if (!dragging || !selected) return; const p=canvasPoint(e); selected.x=p.x-dragOffset.x; selected.y=p.y-dragOffset.y; renderCanvas(); });
    canvas.addEventListener("pointerup", e => { dragging=false; canvas.classList.remove("dragging"); try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} });
    window.addEventListener("keydown", e => { if (!selected || !["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) return; e.preventDefault(); const step=e.shiftKey?25:5; if(e.key==="ArrowLeft")selected.x-=step; if(e.key==="ArrowRight")selected.x+=step; if(e.key==="ArrowUp")selected.y-=step; if(e.key==="ArrowDown")selected.y+=step; renderCanvas(); });
    document.getElementById("zoomOut").addEventListener("click",()=>setZoom(Math.max(.25,Number(zoomRange.value)-.1)));
    document.getElementById("zoomIn").addEventListener("click",()=>setZoom(Math.min(2.5,Number(zoomRange.value)+.1)));
    zoomRange.addEventListener("input",()=>setZoom(Number(zoomRange.value)));
    document.getElementById("fitWidth").addEventListener("click",()=>{ setZoom(Math.max(.25, Math.min(2.5, (viewport.clientWidth-70)/canvas.width))); viewport.scrollTo({left:0,top:0}); });
    fontSizeInput.addEventListener("input", renderCanvas); lineWidthInput.addEventListener("input", renderCanvas);
    document.getElementById("clearSelection").addEventListener("click",()=>{selected=null; renderCanvas();});
    document.getElementById("resetAnchors").addEventListener("click",()=>{ for(const l of labels){l.x=l.anchor.x; l.y=l.anchor.y;} renderCanvas(); });
    document.getElementById("resetLast").addEventListener("click",()=>applyLayoutObject(initialLayout));
    document.getElementById("downloadPng").addEventListener("click",()=>{
      const out=document.createElement("canvas"); out.width=image.naturalWidth; out.height=image.naturalHeight; const outCtx=out.getContext("2d", { alpha:false }); renderTo(outCtx, 1, false);
      out.toBlob(blob => { if (!blob) { const w=window.open("","_blank"); if(w) w.document.write(`<img src="${out.toDataURL("image/png")}" alt="Figure 14 labeled export">`); return; } const url=URL.createObjectURL(blob); download("Figure_14_MD_structural_snapshots_strip_manual_labels.png", url); setTimeout(()=>URL.revokeObjectURL(url), 10000); }, "image/png");
    });
    document.getElementById("downloadJson").addEventListener("click",()=>{ const blob=new Blob([jsonText.value],{type:"application/json"}); const url=URL.createObjectURL(blob); download("Figure_14_manual_label_layout.json", url); setTimeout(()=>URL.revokeObjectURL(url),10000); });
    document.getElementById("copyJson").addEventListener("click",async()=>navigator.clipboard.writeText(jsonText.value));
    document.getElementById("applyTextJson").addEventListener("click",()=>applyLayoutObject(JSON.parse(jsonText.value)));
    document.getElementById("jsonFile").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>applyLayoutObject(JSON.parse(r.result)); r.readAsText(file); });
    image.onload = () => { renderScale = Math.min(1, Math.sqrt(MAX_LIVE_PIXELS / (image.naturalWidth * image.naturalHeight))); canvas.width = Math.round(image.naturalWidth * renderScale); canvas.height = Math.round(image.naturalHeight * renderScale); buildLabelList(); setZoom(Number(zoomRange.value)); renderCanvas(); };
    image.onerror = () => { document.body.innerHTML = `<pre style="padding:20px;font:16px monospace;color:#900">Could not load image: ${IMAGE_SRC}</pre>`; };
    image.src = `${IMAGE_SRC}?${IMAGE_CACHE_BUST}`;
  </script>
</body>
</html>
