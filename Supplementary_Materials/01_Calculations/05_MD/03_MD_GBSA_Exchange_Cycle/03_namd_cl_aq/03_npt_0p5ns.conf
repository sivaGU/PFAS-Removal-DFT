amber             yes
parmfile          ../01_build_bulk/cl_aq.prmtop
ambercoor         ../01_build_bulk/cl_aq.inpcrd
binCoordinates    cl_aq_nvt_heat.restart.coor
binVelocities     cl_aq_nvt_heat.restart.vel
extendedSystem    cl_aq_nvt_heat.restart.xsc

outputname        cl_aq_npt_0p5ns
binaryoutput      yes

exclude           scaled1-4
readexclusions    yes
1-4scaling        0.833333333
scnb              2.0

switching         off
cutoff            9.0
pairlistdist      11.0
LJcorrection      on
margin            8.0
PME               yes
PMEGridSpacing    1.0

rigidBonds        all
rigidTolerance    1.0e-8
timestep          2.0

langevin          on
langevinTemp      310.15
langevinDamping   1.0

langevinPiston              on
langevinPistonTarget        1.01325
langevinPistonPeriod        100.0
langevinPistonDecay         50.0
langevinPistonTemp          310.15
useGroupPressure  yes
useFlexibleCell   no
useConstantArea   no

outputEnergies    500
outputTiming      500
restartfreq       2500
dcdfreq           5000
xstFreq           2500

run               250000
