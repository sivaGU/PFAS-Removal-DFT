# Resin-only chloride-form 2 ns NPT continuation
# Do not run until 03_npt_short passes visual and log checks.
# No resin shape restraints are used.

amber             yes
parmfile          ../04_leap/solvated_resin_cl.prmtop
ambercoor         ../04_leap/solvated_resin_cl.inpcrd

binCoordinates    resin_only_npt_short.restart.coor
binVelocities     resin_only_npt_short.restart.vel
extendedSystem    resin_only_npt_short.restart.xsc

outputname        resin_only_npt_2ns
binaryoutput      yes

exclude           scaled1-4
readexclusions    yes
1-4scaling        0.833333333
scnb              2.0

switching         off
cutoff            9.0
pairlistdist      11.0
LJcorrection      on

PME               yes
PMEGridSpacing    1.0

rigidBonds        all
rigidTolerance    1.0e-8
timestep          2.0

langevin          on
langevinTemp      310.15
langevinDamping   1.0

langevinPiston              on
langevinPistonTarget        1.01325
langevinPistonPeriod        100.0
langevinPistonDecay         50.0
langevinPistonTemp          310.15

useGroupPressure  yes
useFlexibleCell   no
useConstantArea   no

outputEnergies    1000
outputTiming      1000
restartfreq       5000
dcdfreq           5000
xstFreq           5000

run               1000000
