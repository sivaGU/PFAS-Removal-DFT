# resin_pfoa_exchange chloride-exchange minimization
# No resin or PFAS shape restraints are used.

amber             yes
parmfile          ../05_pfas_exchange/solvated_resin_pfoa_exchange.prmtop
ambercoor         ../05_pfas_exchange/solvated_resin_pfoa_exchange.inpcrd

outputname        resin_pfoa_exchange_min
binaryoutput      yes

exclude           scaled1-4
readexclusions    yes
1-4scaling        0.833333333
scnb              2.0

switching         off
cutoff            9.0
pairlistdist      11.0
LJcorrection      on

PME               yes
PMEGridSpacing    1.0

cellBasisVector1  126.82707800 0.0 0.0
cellBasisVector2  0.0 116.72550200 0.0
cellBasisVector3  0.0 0.0 104.37036200
cellOrigin        0.0 0.0 0.0

temperature       310.15

rigidBonds        all
rigidTolerance    1.0e-8
timestep          2.0

outputEnergies    100
outputTiming      100
restartfreq       1000
dcdfreq           1000
xstFreq           1000

minimize          10000
