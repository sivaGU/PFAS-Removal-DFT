# PFOA exchange 1 ns NPT continuation
# No resin/PFOA restraints are used.

amber             yes
parmfile          ../05_pfas_exchange/solvated_resin_pfoa_exchange.prmtop
ambercoor         ../05_pfas_exchange/solvated_resin_pfoa_exchange.inpcrd

binCoordinates    resin_pfoa_exchange_npt_short.restart.coor
binVelocities     resin_pfoa_exchange_npt_short.restart.vel
extendedSystem    resin_pfoa_exchange_npt_short.restart.xsc

outputname        resin_pfoa_exchange_npt_1ns
binaryoutput      yes

exclude           scaled1-4
readexclusions    yes
1-4scaling        0.833333333
scnb              2.0

switching         off
cutoff            9.0
pairlistdist      11.0
LJcorrection      on

PME               yes
PMEGridSpacing    1.0

# Patch-grid margin for the initially roomy LEaP solvent box during NPT relaxation.
margin            8.0

rigidBonds        all
rigidTolerance    1.0e-8
timestep          2.0

langevin          on
langevinTemp      310.15
langevinDamping   1.0

langevinPiston              on
langevinPistonTarget        1.01325
langevinPistonPeriod        100.0
langevinPistonDecay         50.0
langevinPistonTemp          310.15

useGroupPressure  yes
useFlexibleCell   no
useConstantArea   no

outputEnergies    1000
outputTiming      1000
restartfreq       5000
dcdfreq           5000
xstFreq           5000

run               500000
