# Common NAMD3 settings for the pVBTMA12 Stage 09 prepared-PFOA pilot workflow.
amber                 on
exclude               scaled1-4
oneFourScaling        0.833333
scnb                   2.0

# Nonbonded treatment retained from the manuscript MD protocol.
cutoff                 9.0
switching              off
pairlistdist           11.0
LJcorrection           yes

# Periodic electrostatics.
PME                    yes
PMEGridSpacing         1.0

# Integration and constraints.
timestep               2.0
rigidBonds             all
rigidTolerance         1.0e-8
nonbondedFreq          1
fullElectFrequency     2
stepspercycle          10

# Coordinate/output behavior.
wrapAll                on
binaryoutput           yes
binaryrestart          yes
outputEnergies         500
outputTiming           5000
restartfreq            5000
xstFreq                5000

# Shared Langevin parameters. Each dynamics stage explicitly enables Langevin
# and sets its own target temperature. Minimization explicitly disables it.
langevinDamping        1.0
langevinHydrogen       on
