source stage08_common.conf
source stage08_system.generated.conf

parmfile               $stage07_prmtop
ambercoor              $stage07_inpcrd

cellBasisVector1       $boxX 0.0 0.0
cellBasisVector2       0.0 $boxY 0.0
cellBasisVector3       0.0 0.0 $boxZ
cellOrigin             0.0 0.0 0.0

# NAMD requires an initial velocity source in the configuration even for a
# minimization-only stage. These assigned velocities are not propagated into
# Stage 01; Stage 01 initializes its own 100 K velocities after minimization.
seed                   202609180
temperature            100.0
langevin               off

outputName             00_minimize/minimize
minimize               10000
